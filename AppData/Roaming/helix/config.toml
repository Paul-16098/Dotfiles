"C-." = "code_action"
F2 = "rename_symbol"
space.e = {
  label = "Yazi",
  command = [
    ":sh rm -f -p  ($nu.temp-dir | path join 'yazi-chooser-file')",
    ':insert-output yazi ...(if not ((echo `%{buffer_name}`) == "[scratch]") { [`%{buffer_name}`] } else { [] }) --chooser-file=($nu.temp-dir | path join yazi-chooser-file)',
    ":open %sh{cat ($nu.temp-dir | path join 'yazi-chooser-file')}",
    ":redraw",
    ":set mouse false",
    ":set mouse true",
  ]
}
space.l = {
  label = "lazygit",
  command = [
    ":insert-output lazygit",
    ":redraw",
    ":set mouse false",
    ":set mouse true",
    ":rl",
  ]
}
C-f = "search"

A-up = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before", ":clear-register '\"'"]
A-down = ["extend_to_line_bounds", "delete_selection", "move_line_down", "paste_before", ":clear-register '\"'"]


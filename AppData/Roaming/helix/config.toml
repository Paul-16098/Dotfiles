#:tombi toml-version = "v1.1.0"

theme = "catppuccin_mocha"

[editor]
shell = ["nu", "--stdin", "--config", '~\.config\nushell\config.nu', "--env-config", '~\.config\nushell\env.nu', "--commands"]
bufferline = "always"
indent-guides.render = true
indent-guides.skip-levels = 1
soft-wrap.enable = true
end-of-line-diagnostics = "hint"
color-modes = true
rainbow-brackets = true

[editor.breadcrumb]
enable = true

[editor.gutters]
layout = ["diagnostics", "code-action-hint", "line-numbers", "diff", "spacer"]
line-numbers.min-width = 1

[editor.statusline]
left = [
  "mode",
  "spinner",
  #
  # "file-name",
  # "read-only-indicator",
  # "file-modification-indicator",
  #
  "spacer",
  "version-control",
]
center = []
right = [
  "diagnostics",
  "selections",
  "register",
  # ------
  "separator",
  "position",
  "file-indent-style",
  "file-encoding",
  "file-line-ending",
  "file-type",
]

[editor.whitespace.render]
space = "all"
tab = "all"
nbsp = "none"
nnbsp = "none"
newline = "none"

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
nnbsp = "␣"
tab = "→"
newline = "⏎"
tabpad = "·"  # Tabs will look like "→···" (depending on tab width)

[editor.lsp]
display-inlay-hints = true
display-progress-messages = true
auto-document-highlight = true

[editor.inline-diagnostics]
cursor-line = "hint"
other-lines = "warning"

[editor.file-explorer]
ignore = true

[editor.file-picker]
hidden = false


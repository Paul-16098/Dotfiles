#:tombi toml-version = "v1.1.0"

use-grammars = { except = ["embedded-template"] }

[language-server.simple-completion-language-server]
command = "simple-completion-language-server"
config = {
  feature_words = false,  # enable completion by word
  feature_snippets = true,  # enable snippets
  snippets_first = true,  # completions will return before snippets by default
  case_sensitive = false,  # when true, only exact-case matches are suggested; when false, exact-case matches are just prioritized first
  snippets_inline_by_word_tail = false,  # suggest snippets by WORD tail, for example text `xsq|` become `x^2|` when snippet `sq` has body `^2`
  feature_unicode_input = false,  # enable "unicode input"
  feature_paths = false,  # enable path completion
  feature_citations = false  # enable citation completion (only on `citation` feature enabled)
}

[language-server.tombi]
args = ["lsp"]

[[grammar]]
name = "nu"
source = { git = "https://github.com/nushell/tree-sitter-nu", rev = "main" }

[[language]]
name = "nu"
# formatter = { command = "nufmt", args = ["%{buffer_name}"] }
formatter = { command = "topiary", args = ["format", "--language", "nu"] }

[[language]]
name = "stub"
scope = "text.stub"
file-types = []
shebangs = []
roots = []
auto-format = false
language-servers = ["simple-completion-language-server"]

[[language]]
name = "json"
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }
# language-servers = ["biome"]

